<text x="42" y="118" font-size="46" class="b" fill="url(#grad)" style="fill:url(#grad)" letter-spacing="3">ATIKSH SHUKLA</text>
<text x="44" y="176" font-size="24" class="" text-anchor="start" >Building where physics, AI, and software meet</text>
<rect class="cur" x="697.9999999999999" y="156" width="12" height="24" fill="#22D3EE"/>
</svg>
