name: Update profile

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/update-profile.yml, scripts/update_profile.py]

permissions:
  contents: write

concurrency: update-profile

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCCZ_TlSyNhcmuBQPn4wANaA"
          max_post_count: 3
          template: "$newline- [$title]($url)"
          # Some titles use en dashes; the README avoids them.
          item_exec: 'post.title = post.title.replace(/\s*[\u2013\u2014]\s*/g, ", ")'
          commit_message: "chore: latest LifeAndBooks videos"
          committer_username: "github-actions[bot]"
          committer_email: "github-actions[bot]@users.noreply.github.com"
          # The YouTube feed intermittently returns 500.
          retry_count: 5
          retry_wait_time: 10

      - name: Test
        run: python3 tests/test_update_profile.py

      - name: Render stats cards and refresh README numbers
        env:
          # Optional PROFILE_TOKEN (classic PAT: read:user, repo) makes counts include private work.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_profile.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --quiet
          git add assets README.md
          git diff --cached --quiet || (git commit -m "chore: refresh profile stats" && git push)
