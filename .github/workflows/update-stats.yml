name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats and patch README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPOS=$(gh api users/ats4321 --jq ".public_repos")
          FOLLOWERS=$(gh api users/ats4321 --jq ".followers")
          STARS=$(gh api users/ats4321/repos --jq "[.[].stargazers_count] | add // 0")

          sed -i "s/Repos: [0-9]*  |  Stars: [0-9]*  |  Followers: [0-9]*/Repos: $REPOS  |  Stars: $STARS  |  Followers: $FOLLOWERS/" README.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add README.md && git commit -m "chore: update GitHub stats" && git push)
